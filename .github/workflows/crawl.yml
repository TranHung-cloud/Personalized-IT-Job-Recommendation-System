name: Crawl Scheduler

on:
  schedule:
    - cron: "0 20 * * *"

  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r crawl/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Determine crawl task
        id: task
        run: |
          START_DATE="2026-11-11"
          TODAY=$(date -u +%Y-%m-%d)

          DAYS=$(( ($(date -d "$TODAY" +%s) - $(date -d "$START_DATE" +%s)) / 86400 ))
          CYCLE=$((DAYS % 4))

          if [ "$CYCLE" -eq 0 ]; then
            echo "script=crawl.crawl_url" >> $GITHUB_OUTPUT
          else
            echo "script=crawl.crawl_job" >> $GITHUB_OUTPUT
          fi

      - name: Run crawl script
        run: |
          python -m ${{ steps.task.outputs.script }}
