name: Crawl Scheduler

on:
  schedule:
    - cron: "0 20 * * *"

  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r crawl/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Install Google Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install Xvfb
        run: |
          sudo apt-get install -y xvfb

      - name: Determine crawl task
        id: task
        run: |
          START_DATE="2026-11-11"
          TODAY=$(date -u +%Y-%m-%d)

          DAYS=$(( ($(date -d "$TODAY" +%s) - $(date -d "$START_DATE" +%s)) / 86400 ))
          CYCLE=$((DAYS % 4))

          if [ "$CYCLE" -eq 0 ]; then
            echo "script=crawl.crawl_url" >> $GITHUB_OUTPUT
          else
            echo "script=crawl.crawl_job" >> $GITHUB_OUTPUT
          fi

      - name: Run crawl script
        env:
          PYTHONPATH: ${{ github.workspace }}
          PYTHONUNBUFFERED: "1"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STORAGE_BUCKET: ${{ secrets.STORAGE_BUCKET }}
          AWS_ENDPOINT_URL_S3: ${{ secrets.AWS_ENDPOINT_URL_S3 }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -o pipefail
          mkdir -p log
          xvfb-run -a \
          --server-args="-screen 0 1366x768x24" \
          python -u -m ${{ steps.task.outputs.script }} \
          2>&1 | tee log/app.log
