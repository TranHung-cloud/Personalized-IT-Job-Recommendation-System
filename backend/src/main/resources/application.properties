spring.application.name=backend

# Profile
spring.profiles.active=local

# Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Profile certificate uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

# AWS S3 Configuration
aws.region=${AWS_REGION:ap-southeast-1}
aws.s3.bucket=${STORAGE_BUCKET}
aws.s3.endpoint=${AWS_ENDPOINT_URL_S3}

# Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

# Email confirmation link and signing secret (generate a random secret of at least 32 bytes).
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.email-verification.jwt-secret=${EMAIL_VERIFICATION_JWT_SECRET}

# JWT Authentication
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS}

